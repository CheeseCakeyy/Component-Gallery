<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1c1d30"><meta name="description" content="A black and gold pixel dragon flies through an endless sunset sky. Drag to see its flight from every angle.">
<title>Dragonflight · Pixel skies</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#1c1d30;color:#fff0ce;font-family:ui-monospace,Consolas,monospace}main{height:100dvh;min-height:460px;position:relative;overflow:hidden}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}header{position:absolute;top:28px;left:32px;pointer-events:none;text-shadow:3px 3px #252137}h1{margin:0;font-size:18px;letter-spacing:4px;font-weight:700}header p{font-size:12px;letter-spacing:2px;color:#efc796;margin:9px 0}.badge{position:absolute;right:32px;top:30px;color:#efc796;font-size:12px;letter-spacing:2px;text-shadow:2px 2px #252137;pointer-events:none}.bottom{position:absolute;left:0;right:0;bottom:28px;display:flex;align-items:center;flex-direction:column;gap:15px;pointer-events:none}nav{display:flex;gap:8px;pointer-events:auto}button{font:700 14px ui-monospace,Consolas,monospace;letter-spacing:1px;padding:12px 20px;border:2px solid #ab8281;background:#282437;color:#f8deba;box-shadow:3px 3px 0 #181a2c;cursor:pointer;border-radius:0}button:hover{background:#49384e}button[aria-pressed=true]{background:#f2c17d;color:#282437;border-color:#ffe3a3}button:focus-visible,canvas:focus-visible{outline:3px solid #fff0ce;outline-offset:4px}.hint{margin:0;font-size:12px;color:#ffe3b1;text-shadow:2px 2px #292037;letter-spacing:1px}.pause{padding:12px 14px}.error{position:absolute;top:45%;left:10%;right:10%;padding:20px;background:#282437;text-align:center}[hidden]{display:none!important}@media(max-width:600px){header{top:22px;left:20px}h1{font-size:15px;letter-spacing:3px}.badge{display:none}button{padding:12px 11px;font-size:12px}nav{gap:6px}.bottom{bottom:24px}.hint{font-size:11px;letter-spacing:0}}@media(max-height:500px){header{top:15px}.bottom{bottom:12px;gap:9px}}
</style></head>
<body><main>
<canvas id="sky" tabindex="0" aria-label="Animated pixel dragon. Drag to orbit, scroll to zoom, use keys 1, 2, 3 for above, side and below. Space pauses flight."></canvas>
<header><h1>DRAGONFLIGHT</h1><p>THE AMBER SKIES</p></header><div class="badge">BLACK WINGS / GOLDEN HOUR</div>
<div class="bottom"><nav aria-label="Flight controls"><button data-view="above" aria-pressed="false">1 ABOVE</button><button data-view="side" aria-pressed="true">2 SIDE</button><button data-view="below" aria-pressed="false">3 BELOW</button><button id="pause" class="pause" aria-label="Pause flight" aria-pressed="false">Ⅱ</button></nav><p class="hint">DRAG TO ORBIT · SCROLL TO ZOOM · SPACE TO PAUSE</p></div>
<p id="error" class="error" hidden>Unable to start the sky. Refresh the page to try again.</p>
</main><script src="./flight.js"></script><script>
const canvas=document.querySelector('#sky'),ctx=canvas.getContext('2d',{alpha:false});
const engine=new PixelFlight(480,300);let frame,elapsed=0,last=performance.now(),paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
let camera={yaw:1.55,elevation:.12,zoom:1,bank:0},target={...camera};const buttons=[...document.querySelectorAll('[data-view]')];
function resize(){const scale=Math.max(2,Math.round(Math.max(innerWidth/480,innerHeight/340)));canvas.width=Math.round(innerWidth/scale);canvas.height=Math.round(innerHeight/scale);engine.resize(canvas.width,canvas.height);frame=ctx.createImageData(canvas.width,canvas.height);ctx.imageSmoothingEnabled=false;}resize();addEventListener('resize',resize);
function setView(view){const views={above:[0,1.48],side:[1.55,.12],below:[.15,-1.35]};[target.yaw,target.elevation]=views[view];buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));}
buttons.forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
const pause=document.querySelector('#pause');function syncPause(){pause.textContent=paused?'▶':'Ⅱ';pause.setAttribute('aria-label',paused?'Resume flight':'Pause flight');pause.setAttribute('aria-pressed',String(paused));}function togglePause(){paused=!paused;syncPause();}pause.addEventListener('click',togglePause);syncPause();
let drag=null;canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,yaw:target.yaw,elevation:target.elevation};canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(!drag)return;target.yaw=drag.yaw+(e.clientX-drag.x)*.008;target.elevation=Math.max(-1.53,Math.min(1.53,drag.elevation+(e.clientY-drag.y)*.008));buttons.forEach(b=>b.setAttribute('aria-pressed','false'));});['pointerup','pointercancel','lostpointercapture'].forEach(type=>canvas.addEventListener(type,()=>drag=null));canvas.addEventListener('wheel',e=>{e.preventDefault();target.zoom=Math.max(.65,Math.min(1.5,target.zoom-e.deltaY*.001));},{passive:false});
addEventListener('keydown',e=>{if(['1','2','3'].includes(e.key))setView(['above','side','below'][Number(e.key)-1]);if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();togglePause();}});
function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;if(!paused)elapsed+=dt;const smooth=1-Math.exp(-dt*7);if(!paused){const bank=drag?Math.max(-.25,Math.min(.25,(target.yaw-camera.yaw)*.42)):0;camera.bank+=(bank-camera.bank)*(1-Math.exp(-dt*3));}for(const key of ['yaw','elevation','zoom'])camera[key]+=(target[key]-camera[key])*smooth;frame.data.set(engine.render(elapsed,camera));ctx.putImageData(frame,0,0);requestAnimationFrame(loop);}try{requestAnimationFrame(loop);}catch(error){document.querySelector('#error').hidden=false;console.error(error);}
// Local preview refreshes when either source file changes.
if(location.hostname==='127.0.0.1'||location.hostname==='localhost'){
 let stamp='';setInterval(async()=>{try{const responses=await Promise.all(['./index.html','./flight.js'].map(url=>fetch(url,{method:'HEAD',cache:'no-store'})));if(responses.some(r=>!r.ok))return;const next=responses.map(r=>r.headers.get('last-modified')+':'+r.headers.get('content-length')).join('|');if(stamp&&stamp!==next)location.reload();stamp=next;}catch{}},1500);
}
</script></body></html>
