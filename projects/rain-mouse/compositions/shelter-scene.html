    <g data-hf-id="hf-uobm" id="leaf" clip-path="url(#leaf-cut)"><image data-hf-id="hf-lod0" href="assets/original.png" width="736" height="920" /></g>
   </g>
   <g data-hf-id="hf-znfg" id="drips" fill="none" stroke="#42443f" stroke-linecap="round" />
   <g data-hf-id="hf-lt0a" id="mouse" clip-path="url(#mouse-cut)"><image data-hf-id="hf-la1z" href="assets/original.png" width="736" height="920" /></g>
   <g data-hf-id="hf-qsik" id="ground" clip-path="url(#ground-cut)"><image data-hf-id="hf-mgz2" href="assets/original.png" width="736" height="920" /></g>
   <g data-hf-id="hf-sbpv" id="splashes" fill="none" stroke="#444640" stroke-width="0.85" stroke-linecap="round" />
  </svg>
 </div>
</div>
<script>
  const TAU = Math.PI * 2;
  const NS = 'http://www.w3.org/2000/svg';
  const rain = document.getElementById('rain');
  const leaf = document.getElementById('leaf');
  const upright = document.getElementById('upright');
  const mouse = document.getElementById('mouse');
  const phase = { t: 0 };
  const fract = n => n - Math.floor(n);
  const hash = n => fract(Math.sin(n * 127.1 + 311.7) * 43758.5453);
  const lerp = (a,b,v) => a + (b-a)*v;
  const canopy = [[157,307],[192,309],[222,303],[257,281],[283,295],[310,276],[340,285],[365,284],[395,264],[420,266],[445,224],[472,245],[492,249],[524,263],[544,261],[567,236],[593,208]];
  const leafEdge = [[198,585],[221,559],[258,535],[290,523],[324,520],[358,523],[391,534],[421,550],[447,573],[470,606],[495,652]];
  function atCurve(points,x) {
    for(let i=1;i<points.length;i++) if(x<=points[i][0]) return lerp(points[i-1][1],points[i][1],(x-points[i-1][0])/(points[i][0]-points[i-1][0]));
    return points[points.length-1][1];
  }
  const drops=[];
  for(let i=0;i<2450;i++) {
    const line=document.createElementNS(NS,'path');
    const x=161+hash(i+7)*431;
    line.setAttribute('stroke-width',(0.62+hash(i+803)*0.63).toFixed(2));
    line.setAttribute('opacity',(0.52+hash(i+501)*0.34).toFixed(2));
    rain.appendChild(line);
    drops.push({line,x,offset:hash(i+2301),length:5+hash(i+607)*16,cycles:1+Math.floor(hash(i+77)*2),jitter:(hash(i+605)-.5)*1.1});
  }
  const dripNodes=Array.from({length:4},()=>{
    const p=document.createElementNS(NS,'path');p.setAttribute('stroke-width','1.1');document.getElementById('drips').appendChild(p);return p;
  });
  const splashNodes=Array.from({length:20},()=>{
    const p=document.createElementNS(NS,'path');document.getElementById('splashes').appendChild(p);return p;
  });
  function shiver(t,center,width) {
    const distance=Math.abs(t-center);
    if(distance>=width)return 0;
    return Math.pow(Math.cos(distance/width*Math.PI/2),2);
  }
  function draw(t) {
    const p=t/6*TAU;
    const breeze=Math.sin(p)+.3*Math.sin(2*p);
    const tipDip=.24*Math.sin(6*p)*Math.pow(.5+.5*Math.sin(2*p),4);
    const leafAngle=.88*breeze+tipDip;
    const uprightAngle=.52*Math.sin(p-.3)+.15*Math.sin(3*p);
    leaf.setAttribute('transform',`rotate(${leafAngle} 505 674)`);
    upright.setAttribute('transform',`rotate(${uprightAngle} 505 674)`);
    const cold=shiver(t,1.3,.48)+shiver(t,3.75,.55)+shiver(t,5.2,.28);
    const shake=cold*(.72*Math.sin(TAU*13*t)+.24*Math.sin(TAU*19*t));
    const breath=.0024*Math.sin(2*p);
    mouse.setAttribute('transform',`translate(${shake} ${-.22*cold*Math.cos(TAU*17*t)}) translate(333 785) scale(${1+breath} ${1-breath}) rotate(${shake*.22}) translate(-333 -785)`);
    for(const d of drops) {
      const x=d.x+2.4*breeze;
      const top=atCurve(canopy,d.x)-3;
      const sheltered=d.x>201&&d.x<497;
      const bottom=sheltered ? atCurve(leafEdge,d.x)+(d.x-505)*Math.sin(leafAngle*Math.PI/180)-3 : 781;
      const span=600;
      const progress=fract(d.offset+t/6*d.cycles);
      const y=top+progress*(span+d.length)-d.length;
      const end=Math.min(bottom,y+d.length);
      const start=Math.max(top,y);
      const slant=(.35+.55*Math.sin(p+.5))*d.length/15;
      d.line.setAttribute('d',end>start?`M${x.toFixed(2)} ${start.toFixed(2)} Q${(x+slant*.45+d.jitter).toFixed(2)} ${((start+end)/2).toFixed(2)} ${(x+slant).toFixed(2)} ${end.toFixed(2)}`:'');
    }
    dripNodes.forEach((node,i)=>{
      const q=fract(t/3+i*.27);
      const visible=q<.34;
      const angle=leafAngle*Math.PI/180;
      const tipX=505+(207-505)*Math.cos(angle)-(580-674)*Math.sin(angle);
      const tipY=674+(207-505)*Math.sin(angle)+(580-674)*Math.cos(angle);
      const dy=190*Math.pow(q/.34,2);
      node.setAttribute('d',visible?`M${tipX+q*9} ${tipY+dy+2} l.4 ${2+q*18}`:'');
      node.setAttribute('opacity',visible?String(.62*(1-q/.34)):'0');
    });
    splashNodes.forEach((node,i)=>{
      const q=fract(t/2+hash(i+590));
      const x=i<10?165+hash(i+51)*36:551+hash(i+97)*34;
      const y=780+hash(i+7)*8;
      const u=q/.22;
      node.setAttribute('d',q<.22?`M${x-3*u} ${y-3*Math.sin(u*Math.PI)} l-1.2 -2 M${x+3*u} ${y-2*Math.sin(u*Math.PI)} l1.2 -1.4`:'');
      node.setAttribute('opacity',String(.55*(1-Math.min(u,1))));
    });
  }
  const tl=gsap.timeline({paused:true});
  tl.fromTo(phase,{t:0},{t:6,duration:6,ease:'none',onUpdate:()=>draw(phase.t)},0);
  window.__timelines=window.__timelines||{};
  window.__timelines['shelter-scene']=tl;
  draw(0);
</script>
